{% extends 'base.html' %}
{% load static persian_tags %}

{% block title %}ورود به حساب کاربری | عطارخونه{% endblock %}

{% block content %}
<div class="container" style="max-width: 380px; margin: 30px auto;">

  <div style="background: #ffffff; padding: 22px 24px; border-radius: var(--radius-md); border: 1px solid var(--border); box-shadow: var(--shadow-sm);">
    
    <div style="text-align: center; margin-bottom: 18px;">
      <div style="font-size: 28px; margin-bottom: 4px;">🔑</div>
      <h1 style="font-size: 15px; font-weight: 700; color: var(--primary-dark);">ورود به سامانه عطارخونه</h1>
      <p style="font-size: 11px; color: #64748b; margin-top: 2px;">جهت پیگیری سفارش‌ها یا دسترسی کارمندان</p>
    </div>

    <form method="post">
      {% csrf_token %}

      <div style="margin-bottom: 12px;">
        <label style="display: block; font-size: 11px; color: #475569; margin-bottom: 3px;">نام کاربری یا نشانی ایمیل</label>
        <input type="text" name="username" required autofocus placeholder="نام کاربری یا email@example.com" value="{{ identifier|default:'' }}" style="width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius-xs); font-family: inherit; font-size: 12px;">
      </div>

      <div style="margin-bottom: 16px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 3px;">
          <label style="font-size: 11px; color: #475569;">گذرواژه</label>
          <a href="{% url 'accounts:password_reset' %}" style="font-size: 10.5px; color: var(--primary);">فراموشی رمز عبور؟</a>
        </div>
        <input type="password" name="password" required style="width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius-xs); font-family: inherit; font-size: 12px;">
      </div>

      <button type="submit" class="btn-hero" style="width: 100%; border: none; cursor: pointer; font-size: 12.5px; padding: 9px;">
        ورود به حساب کاربری »
      </button>

      <div style="margin-top: 14px; text-align: center; font-size: 11.5px;">
        حساب کاربری ندارید؟ <a href="{% url 'accounts:register' %}" style="font-weight: 600;">ثبت‌نام سریع</a>
      </div>
    </form>

  </div>

</div>
{% endblock %}
