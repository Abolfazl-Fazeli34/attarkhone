{% extends 'base.html' %}
{% load static persian_tags %}

{% block title %}ثبت‌نام مشتری جدید | عطارخونه{% endblock %}

{% block content %}
<div class="container" style="max-width: 400px; margin: 30px auto;">

  <div style="background: #ffffff; padding: 22px 24px; border-radius: var(--radius-md); border: 1px solid var(--border); box-shadow: var(--shadow-sm);">
    
    <div style="text-align: center; margin-bottom: 18px;">
      <div style="font-size: 28px; margin-bottom: 4px;">📝</div>
      <h1 style="font-size: 15px; font-weight: 700; color: var(--primary-dark);">ثبت‌نام در باشگاه عطارخونه</h1>
      <p style="font-size: 11px; color: #64748b; margin-top: 2px;">عضویت جهت پیگیری آسان و دریافت کدهای تخفیف</p>
    </div>

    <form method="post">
      {% csrf_token %}

      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px;">
        <div>
          <label style="display: block; font-size: 11px; color: #475569; margin-bottom: 3px;">نام</label>
          <input type="text" name="first_name" style="width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius-xs); font-family: inherit; font-size: 11.5px;">
        </div>
        <div>
          <label style="display: block; font-size: 11px; color: #475569; margin-bottom: 3px;">نام خانوادگی</label>
          <input type="text" name="last_name" style="width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius-xs); font-family: inherit; font-size: 11.5px;">
        </div>
      </div>

      <div style="margin-bottom: 10px;">
        <label style="display: block; font-size: 11px; color: #475569; margin-bottom: 3px;">نام کاربری (انگلیسی) *</label>
        <input type="text" name="username" required value="{{ username|default:'' }}" style="width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius-xs); font-family: inherit; font-size: 11.5px;">
      </div>

      <div style="margin-bottom: 10px;">
        <label style="display: block; font-size: 11px; color: #475569; margin-bottom: 3px;">نشانی ایمیل (جهت فعال‌سازی و دریافت فاکتور) *</label>
        <input type="email" name="email" required value="{{ email|default:'' }}" placeholder="name@example.com" style="width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius-xs); font-family: inherit; font-size: 11.5px; direction: ltr; text-align: left;">
      </div>

      <div style="margin-bottom: 10px;">
        <label style="display: block; font-size: 11px; color: #475569; margin-bottom: 3px;">شماره تلفن همراه *</label>
        <input type="tel" name="phone" required value="{{ phone|default:'' }}" placeholder="09123456789" style="width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius-xs); font-family: inherit; font-size: 11.5px; direction: ltr; text-align: left;">
      </div>

      <div style="margin-bottom: 10px;">
        <label style="display: block; font-size: 11px; color: #475569; margin-bottom: 3px;">گذرواژه *</label>
        <input type="password" name="password" required style="width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius-xs); font-family: inherit; font-size: 11.5px;">
      </div>

      <div style="margin-bottom: 16px;">
        <label style="display: block; font-size: 11px; color: #475569; margin-bottom: 3px;">تکرار گذرواژه *</label>
        <input type="password" name="password_confirm" required style="width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius-xs); font-family: inherit; font-size: 11.5px;">
      </div>

      <button type="submit" class="btn-hero" style="width: 100%; border: none; cursor: pointer; font-size: 12.5px; padding: 9px;">
        ایجاد حساب کاربری »
      </button>

      <div style="margin-top: 14px; text-align: center; font-size: 11.5px;">
        قبلاً ثبت‌نام کرده‌اید؟ <a href="{% url 'accounts:login' %}" style="font-weight: 600;">وارد شوید</a>
      </div>
    </form>

  </div>

</div>
{% endblock %}
