{% extends 'base.html' %}
{% load static persian_tags %}

{% block title %}{{ page.title }} | عطارخونه{% endblock %}

{% block content %}
<div class="container" style="max-width: 850px; margin: 24px auto;">

  <div style="background: #ffffff; padding: 28px; border-radius: var(--radius-md); border: 1px solid var(--border); box-shadow: var(--shadow-sm);">
    
    <div style="border-bottom: 2px solid var(--primary); padding-bottom: 12px; margin-bottom: 20px;">
      <h1 style="font-size: 18px; font-weight: 800; color: var(--primary-dark);">{{ page.title }}</h1>
      <span style="font-size: 11px; color: var(--text-muted);">صفحه استاتیک فروشگاه (کارگاه ۶ کتاب درسی)</span>
    </div>

    <div style="line-height: 1.9; font-size: 12.5px; color: #334155;">
      {{ page.content|safe }}
    </div>

    <div style="margin-top: 30px; padding-top: 14px; border-top: 1px dashed var(--border); font-size: 11px; color: var(--text-light);">
      آخرین ویرایش: {{ page.updated_at|date:"Y/m/d" }}
    </div>

  </div>

</div>
{% endblock %}
