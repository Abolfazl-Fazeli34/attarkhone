services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: attarkhone_app
    restart: unless-stopped
    ports:
      # محدودسازی دسترسی صرفاً به لوکال‌هاست جهت امنیت و پروکسی معکوس Nginx (محدوده ۸۶۵۰ تا ۸۶۵۹)
      - "127.0.0.1:8650:8650"
    environment:
      - DJANGO_DEBUG=False
      - DJANGO_SECRET_KEY=attarkhone-super-secure-production-secret-key-1403
      - DJANGO_ALLOWED_HOSTS=*
      - DJANGO_CSRF_TRUSTED_ORIGINS=http://127.0.0.1:8650,http://localhost:8650,http://attarkhone.ip3.ir,https://attarkhone.ip3.ir,http://*.ip3.ir,https://*.ip3.ir,http://*.ir,https://*.ir
      - PORT=8650
      - GUNICORN_WORKERS=3
      - DJANGO_DB_DIR=/app/data
      - EMAIL_HOST_USER=abolfazlfazeli760@gmail.com
      - EMAIL_HOST_PASSWORD=wybilntwgfhosibv
    volumes:
      - attar_media_volume:/app/media
      - attar_data_volume:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8650/health/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  attar_media_volume:
    name: attarkhone_media_data
  attar_data_volume:
    name: attarkhone_db_data
