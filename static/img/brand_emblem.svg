<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- گرادیان سپر پس‌زمینه زمردی سلطنتی -->
    <linearGradient id="emblemBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#194233"/>
      <stop offset="50%" stop-color="#143529"/>
      <stop offset="100%" stop-color="#0c2018"/>
    </linearGradient>

    <!-- گرادیان طلای درخشان عتیقه -->
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2c6"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa7e18"/>
      <stop offset="100%" stop-color="#f5d77f"/>
    </linearGradient>

    <!-- گرادیان ملایم بدنه هاون برنجی -->
    <linearGradient id="brassMortar" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fae8a4"/>
      <stop offset="30%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#936c12"/>
      <stop offset="100%" stop-color="#5a4108"/>
    </linearGradient>

    <!-- سایه عمیق ظریف -->
    <filter id="emblemShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#08140f" flood-opacity="0.35"/>
    </filter>

    <filter id="innerGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#ffd978" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- بستر بیرونی با سایه -->
  <g filter="url(#emblemShadow)">
    <!-- دایره بیرونی زمردی -->
    <circle cx="60" cy="60" r="54" fill="url(#emblemBg)"/>

    <!-- حلقه طلایی دوبل حاشیه اسلیمی -->
    <circle cx="60" cy="60" r="51.5" fill="none" stroke="url(#goldShine)" stroke-width="1.8"/>
    <circle cx="60" cy="60" r="48" fill="none" stroke="url(#goldShine)" stroke-width="0.75" stroke-dasharray="2, 2.5" opacity="0.85"/>

    <!-- دانه‌های طلایی چهار جهت اصلی (شمسه‌های سنتی) -->
    <circle cx="60" cy="11.5" r="1.8" fill="url(#goldShine)"/>
    <circle cx="60" cy="108.5" r="1.8" fill="url(#goldShine)"/>
    <circle cx="11.5" cy="60" r="1.8" fill="url(#goldShine)"/>
    <circle cx="108.5" cy="60" r="1.8" fill="url(#goldShine)"/>

    <!-- تاج نقوش اسلیمی گیاهی بالا -->
    <g transform="translate(60, 20)" fill="url(#goldShine)">
      <circle cx="0" cy="0" r="2.2"/>
      <path d="M-1 -2 C-3 -6 0 -10 0 -10 C0 -10 3 -6 1 -2 Z"/>
      <circle cx="-5" cy="2" r="1.2"/>
      <circle cx="5" cy="2" r="1.2"/>
    </g>

    <!-- شاخه‌های گیاهان دارویی پیرامون هاون (چپ و راست) -->
    <!-- شاخه راست -->
    <g stroke="url(#goldShine)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M78 82 C88 74 90 56 86 42 C84 37 80 32 75 28" stroke-width="1.2"/>
      <!-- برگ‌های شاخه راست -->
      <path d="M84 44 C88 43 92 46 91 50 C87 49 85 46 84 44 Z" fill="url(#goldShine)" stroke-width="0.5"/>
      <path d="M87 56 C92 56 94 60 92 64 C88 62 86 58 87 56 Z" fill="url(#goldShine)" stroke-width="0.5"/>
      <path d="M84 68 C88 69 90 73 87 77 C84 75 83 71 84 68 Z" fill="url(#goldShine)" stroke-width="0.5"/>
      <path d="M78 78 C82 81 83 85 79 88 C77 85 76 81 78 78 Z" fill="url(#goldShine)" stroke-width="0.5"/>
    </g>

    <!-- شاخه چپ -->
    <g stroke="url(#goldShine)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M42 82 C32 74 30 56 34 42 C36 37 40 32 45 28" stroke-width="1.2"/>
      <!-- برگ‌های شاخه چپ -->
      <path d="M36 44 C32 43 28 46 29 50 C33 49 35 46 36 44 Z" fill="url(#goldShine)" stroke-width="0.5"/>
      <path d="M33 56 C28 56 26 60 28 64 C32 62 34 58 33 56 Z" fill="url(#goldShine)" stroke-width="0.5"/>
      <path d="M36 68 C32 69 30 73 33 77 C36 75 37 71 36 68 Z" fill="url(#goldShine)" stroke-width="0.5"/>
      <path d="M42 78 C38 81 37 85 41 88 C43 85 44 81 42 78 Z" fill="url(#goldShine)" stroke-width="0.5"/>
    </g>

    <!-- نماد کهن هاون و دسته هاون سنتی عطاری (Antique Apothecary Mortar & Pestle) -->
    <!-- دسته هاون شیب‌دار -->
    <g transform="translate(60, 56) rotate(-28)">
      <!-- میله دسته هاون -->
      <path d="M-3.5 -30 C-3.5 -33 3.5 -33 3.5 -30 L2.5 6 C2.5 8 -2.5 8 -2.5 6 Z" fill="url(#brassMortar)" stroke="#523a07" stroke-width="0.6"/>
      <!-- سر گرد بالای دسته -->
      <circle cx="0" cy="-31" r="5" fill="url(#brassMortar)" stroke="#523a07" stroke-width="0.6"/>
      <circle cx="-1" cy="-32" r="1.8" fill="#fff7d1" opacity="0.6"/>
      <!-- حلقه تزیینی میانه دسته -->
      <rect x="-4.5" y="-12" width="9" height="2.5" rx="1.2" fill="url(#goldShine)"/>
    </g>

    <!-- کاسه هاون عتیقه -->
    <g id="mortarBowl">
      <!-- سایه زیرین کاسه -->
      <ellipse cx="60" cy="85" rx="20" ry="3.5" fill="#08140f" opacity="0.6"/>
      
      <!-- پایه هاون -->
      <path d="M46 84 C46 82 49 81 60 81 C71 81 74 82 74 84 L72 87 C72 88 48 88 48 87 Z" fill="url(#brassMortar)" stroke="#523a07" stroke-width="0.5"/>
      <ellipse cx="60" cy="87" rx="13" ry="2" fill="url(#goldShine)"/>

      <!-- تنه اصلی کاسه هاون با قوس سنتی -->
      <path d="M38 56 C38 68 47 81 60 81 C73 81 82 68 82 56 L85 54 C85 52 83 51 81 51 L39 51 C37 51 35 52 35 54 Z" fill="url(#brassMortar)" stroke="#523a07" stroke-width="0.6"/>

      <!-- لبه دهانه هاون (Rim) -->
      <ellipse cx="60" cy="53" rx="22" ry="4.5" fill="url(#goldShine)" stroke="#523a07" stroke-width="0.6"/>
      <ellipse cx="60" cy="53" rx="19.5" ry="3.2" fill="#143529"/>

      <!-- گیاهان تازه درون هاون -->
      <path d="M52 52 C48 48 49 43 54 44 C57 45 56 50 52 52 Z" fill="#22c55e"/>
      <path d="M64 51 C68 46 73 48 71 52 C68 54 65 53 64 51 Z" fill="#16a34a"/>
      <path d="M58 50 C58 45 62 43 64 47 C63 50 60 51 58 50 Z" fill="#4ade80"/>

      <!-- شیارها و نقوش اسلیمی بر روی تنه هاون -->
      <path d="M43 60 Q60 66 77 60" fill="none" stroke="url(#goldShine)" stroke-width="1.2" stroke-linecap="round"/>
      <path d="M47 67 Q60 73 73 67" fill="none" stroke="url(#goldShine)" stroke-width="1" stroke-linecap="round"/>
      <circle cx="60" cy="65" r="1.8" fill="url(#goldShine)"/>

      <!-- بازتاب نور طلایی روی شکم هاون -->
      <path d="M43 56 C45 66 50 74 54 78" fill="none" stroke="#fff4cc" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    </g>

    <!-- ستاره‌های شکوه و اصالت پایین -->
    <g transform="translate(60, 96)" fill="url(#goldShine)">
      <polygon points="0,-3.5 1,-1 3.5,-1 1.5,0.5 2.2,3 0,1.5 -2.2,3 -1.5,0.5 -3.5,-1 -1,-1"/>
      <circle cx="-10" cy="0" r="1.2"/>
      <circle cx="10" cy="0" r="1.2"/>
    </g>
  </g>
</svg>
