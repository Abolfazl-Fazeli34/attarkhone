  </defs>
  <rect width="200" height="200" rx="20" fill="url(#bg4)"/>
  <circle cx="100" cy="100" r="70" fill="#ffffff" opacity="0.6"/>
  <!-- Saucer -->
  <ellipse cx="100" cy="150" rx="55" ry="9" fill="#cbd5e1"/>
