  <!-- Mint Leaf on edge -->
  <path d="M75 92 C65 75 85 70 85 85 Z" fill="#16a34a"/>
  <!-- Steam lines -->
  <path d="M92 80 Q88 65 96 52" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>
  <path d="M106 82 Q112 68 104 55" stroke="#64748b" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5"/>
