<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="100%" stop-color="#ede9fe"/>
    </radialGradient>
    <linearGradient id="petal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="20" fill="url(#bg1)"/>
  <circle cx="100" cy="100" r="70" fill="#ffffff" opacity="0.6"/>
  <!-- Stem & Leaves -->
  <path d="M100 100 Q105 150 110 170" stroke="#15803d" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M102 135 C80 130 75 110 95 120" fill="#16a34a"/>
  <path d="M106 145 C130 140 135 120 110 130" fill="#22c55e"/>
  <!-- 5 Petals of Borage -->
  <g transform="translate(100, 95)">
    <path d="M0 0 L-12 -38 Q0 -48 12 -38 Z" fill="url(#petal)"/>
    <path d="M0 0 L-12 -38 Q0 -48 12 -38 Z" fill="url(#petal)" transform="rotate(72)"/>
    <path d="M0 0 L-12 -38 Q0 -48 12 -38 Z" fill="url(#petal)" transform="rotate(144)"/>
    <path d="M0 0 L-12 -38 Q0 -48 12 -38 Z" fill="url(#petal)" transform="rotate(216)"/>
    <path d="M0 0 L-12 -38 Q0 -48 12 -38 Z" fill="url(#petal)" transform="rotate(288)"/>
    <!-- Flower Center -->
    <circle cx="0" cy="0" r="9" fill="#fbbf24"/>
    <circle cx="0" cy="0" r="5" fill="#1f2937"/>
  </g>
</svg>
