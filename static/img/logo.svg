<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56" dir="rtl">
  <defs>
    <!-- گرادیان سپر دارویی زمردی -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#143529"/>
      <stop offset="100%" stop-color="#245a43"/>
    </linearGradient>
    <!-- گرادیان طلایی عتیقه رگبرگ‌ها -->
    <linearGradient id="goldVeins" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d085"/>
      <stop offset="100%" stop-color="#c69214"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <style>
    .brand-title {
      font-family: 'Vazirmatn', 'B Yekan', 'IRANSans', system-ui, -apple-system, sans-serif;
      font-size: 21px;
      font-weight: 800;
      fill: #143529;
      letter-spacing: -0.5px;
    }
    .brand-slogan {
      font-family: 'Vazirmatn', 'B Yekan', 'IRANSans', system-ui, -apple-system, sans-serif;
      font-size: 10px;
      font-weight: 600;
      fill: #3b7a5e;
    }
    .shield-frame {
      stroke: #143529;
      stroke-width: 2.2;
      stroke-linejoin: round;
      fill: none;
    }
    .leaf-vein {
      stroke: #143529;
      stroke-width: 1.8;
      fill: none;
      stroke-linecap: round;
    }
  </style>

  <!-- ۱. نشان شش‌ضلعی نماد سلامت و مفردات گیاهی سمت راست (RTL) -->
  <g transform="translate(196, 8)" filter="url(#softGlow)">
    <!-- کادر بیرونی شش‌ضلعی داروسازی سنتی -->
    <path class="shield-frame" d="M20 2 L36 11 L36 29 L20 38 L4 29 L4 11 Z" fill="#f4f8f5"/>
    <path d="M20 5 L33 12.5 L33 27.5 L20 35 L7 27.5 L7 12.5 Z" fill="none" stroke="#d5b263" stroke-width="0.8" opacity="0.6"/>

    <!-- ساقه و رگبرگ‌های گیاه شفا‌بخش -->
    <path d="M20 8 L20 32" stroke="#143529" stroke-width="2.2" stroke-linecap="round"/>
    
    <!-- جفت برگ اول (فوقانی) -->
    <path class="leaf-vein" d="M20 14 Q28 16 29 22"/>
    <path class="leaf-vein" d="M20 14 Q12 16 11 22"/>

    <!-- جفت برگ دوم (میانی) -->
    <path class="leaf-vein" d="M20 20 Q27 23 27 27"/>
    <path class="leaf-vein" d="M20 20 Q13 23 13 27"/>

    <!-- نقطه کانونی گل آذین -->
    <circle cx="20" cy="8" r="2" fill="#c69214"/>
  </g>

  <!-- ۲. تایپوگرافی فاخر عطارخونه -->
  <g transform="translate(186, 0)">
    <text x="0" y="27" text-anchor="end" class="brand-title">عطارخونه</text>
    <text x="0" y="43" text-anchor="end" class="brand-slogan">دانش کهن، سلامت مدرن</text>
  </g>
</svg>
