<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 58" width="250" height="58" dir="rtl">
  <defs>
    <!-- گرادیان سپر پس‌زمینه زمردی سلطنتی -->
    <linearGradient id="logoEmblemBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4332"/>
      <stop offset="50%" stop-color="#143529"/>
      <stop offset="100%" stop-color="#0a1d15"/>
    </linearGradient>

    <!-- گرادیان طلای درخشان عتیقه -->
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2c6"/>
      <stop offset="35%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#aa7e18"/>
      <stop offset="100%" stop-color="#f5d77f"/>
    </linearGradient>

    <!-- گرادیان بدنه هاون -->
    <linearGradient id="logoMortar" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fae8a4"/>
      <stop offset="30%" stop-color="#d4af37"/>
      <stop offset="70%" stop-color="#936c12"/>
      <stop offset="100%" stop-color="#5a4108"/>
    </linearGradient>

    <filter id="logoShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#08140f" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ۱. نشان مدالیون گیاه‌شناسی و هاون زرین در سمت راست (RTL) -->
  <g transform="translate(219, 29) scale(0.44)" filter="url(#logoShadow)">
    <!-- دایره بیرونی زمردی -->
    <circle cx="0" cy="0" r="54" fill="url(#logoEmblemBg)"/>
    <circle cx="0" cy="0" r="51.5" fill="none" stroke="url(#logoGold)" stroke-width="2"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="url(#logoGold)" stroke-width="0.8" stroke-dasharray="2, 2.5" opacity="0.85"/>

    <!-- دانه‌های طلایی چهار جهت -->
    <circle cx="0" cy="-48.5" r="2" fill="url(#logoGold)"/>
    <circle cx="0" cy="48.5" r="2" fill="url(#logoGold)"/>
    <circle cx="-48.5" cy="0" r="2" fill="url(#logoGold)"/>
    <circle cx="48.5" cy="0" r="2" fill="url(#logoGold)"/>

    <!-- شاخه‌های گیاهی اطراف هاون -->
    <g stroke="url(#logoGold)" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M18 22 C28 14 30 -4 26 -18 C24 -23 20 -28 15 -32" stroke-width="1.3"/>
      <path d="M24 -16 C28 -17 32 -14 31 -10 C27 -11 25 -14 24 -16 Z" fill="url(#logoGold)"/>
      <path d="M27 -4 C32 -4 34 0 32 4 C28 2 26 -2 27 -4 Z" fill="url(#logoGold)"/>
      <path d="M24 8 C28 9 30 13 27 17 C24 15 23 11 24 8 Z" fill="url(#logoGold)"/>

      <path d="M-18 22 C-28 14 -30 -4 -26 -18 C-24 -23 -20 -28 -15 -32" stroke-width="1.3"/>
      <path d="M-24 -16 C-28 -17 -32 -14 -31 -10 C-27 -11 -25 -14 -24 -16 Z" fill="url(#logoGold)"/>
      <path d="M-27 -4 C-32 -4 -34 0 -32 4 C-28 2 -26 -2 -27 -4 Z" fill="url(#logoGold)"/>
      <path d="M-24 8 C-28 9 -30 13 -27 17 C-24 15 -23 11 -24 8 Z" fill="url(#logoGold)"/>
    </g>

    <!-- دسته هاون زاویه‌دار -->
    <g transform="rotate(-28)">
      <path d="M-3.5 -30 C-3.5 -33 3.5 -33 3.5 -30 L2.5 6 C2.5 8 -2.5 8 -2.5 6 Z" fill="url(#logoMortar)" stroke="#523a07" stroke-width="0.6"/>
      <circle cx="0" cy="-31" r="5" fill="url(#logoMortar)"/>
      <circle cx="-1" cy="-32" r="1.8" fill="#fff7d1" opacity="0.6"/>
    </g>

    <!-- بدنه هاون عطاری -->
    <g>
      <ellipse cx="0" cy="27" rx="13" ry="2.5" fill="url(#logoGold)"/>
      <path d="M-22 -4 C-22 8 -13 21 0 21 C13 21 22 8 22 -4 L25 -6 C25 -8 23 -9 21 -9 L-21 -9 C-23 -9 -25 -8 -25 -6 Z" fill="url(#logoMortar)" stroke="#523a07" stroke-width="0.6"/>
      <ellipse cx="0" cy="-7" rx="22" ry="4.5" fill="url(#logoGold)"/>
      <ellipse cx="0" cy="-7" rx="19.5" ry="3.2" fill="#143529"/>
      
      <!-- برگ سبز نعناع و بارهنگ داخل هاون -->
      <path d="M-8 -8 C-12 -12 -11 -17 -6 -16 C-3 -15 -4 -10 -8 -8 Z" fill="#22c55e"/>
      <path d="M4 -9 C8 -14 13 -12 11 -8 C8 -6 5 -7 4 -9 Z" fill="#16a34a"/>

      <!-- شیار زرین روی شکم هاون -->
      <path d="M-17 0 Q0 6 17 0" fill="none" stroke="url(#logoGold)" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="0" cy="5" r="1.8" fill="url(#logoGold)"/>
    </g>
  </g>

  <!-- ۲. تایپوگرافی اصیل و خوش‌تراش نام عطارخونه (Persian Typography) -->
  <g transform="translate(188, 0)">
    <!-- تیتر اصلی: عطارخونه -->
    <text x="0" y="29" text-anchor="end" fill="#143529" font-family="'Vazirmatn', 'B Yekan', 'IRANSans', system-ui, sans-serif" font-size="22" font-weight="900" letter-spacing="-0.5">
      عطارخونه
    </text>

    <!-- الماس زینتی طلایی بالای واژه -->
    <polygon points="-78,13 -75.5,16 -78,19 -80.5,16" fill="url(#logoGold)"/>

    <!-- زیرعنوان: دانش کهن، سلامت مدرن -->
    <text x="0" y="47" text-anchor="end" fill="#8d6b1d" font-family="'Vazirmatn', 'B Yekan', 'IRANSans', system-ui, sans-serif" font-size="10.5" font-weight="700">
      دانش کهن، سلامت مدرن
    </text>

    <!-- برچسب اعتبار دارویی کوچک -->
    <rect x="-184" y="36" width="48" height="15" rx="3" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="0.8"/>
    <text x="-160" y="47" text-anchor="middle" fill="#15803d" font-family="'Vazirmatn', system-ui, sans-serif" font-size="9" font-weight="800">
      داروخانه گیاهی
    </text>
  </g>
</svg>
